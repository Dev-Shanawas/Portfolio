<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020408" />
      <stop offset="100%" stop-color="#0b0f19" />
    </linearGradient>
    <!-- Code Bracket Gradient (Cyan to Purple) -->
    <linearGradient id="codeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00d4ff" />
      <stop offset="100%" stop-color="#7c3aed" />
    </linearGradient>
    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer Rounded Container -->
  <rect x="12" y="12" width="232" height="232" rx="64" fill="url(#bgGrad)" stroke="url(#codeGrad)" stroke-width="6" />
  
  <!-- Subtle inner shadow/glow -->
  <rect x="20" y="20" width="216" height="216" rx="56" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-opacity="0.08" />
  
  <!-- Code Brackets </ > -->
  <g filter="url(#glow)">
    <!-- Left Bracket < -->
    <path d="M 92 84 L 40 128 L 92 172" fill="none" stroke="url(#codeGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
    
    <!-- Slash / -->
    <path d="M 148 64 L 108 192" fill="none" stroke="url(#codeGrad)" stroke-width="18" stroke-linecap="round" />
    
    <!-- Right Bracket > -->
    <path d="M 164 84 L 216 128 L 164 172" fill="none" stroke="url(#codeGrad)" stroke-width="20" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
